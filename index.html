<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="個人管理中心：任務、習慣、財務與訂閱、遊戲化成長。可只存在本機，也可登入後雲端同步。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>每日管理中心</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="app-header">
      <div class="container">
        <h1 class="app-title">每日管理中心</h1>
        <p class="app-date" id="today-label"></p>
        <div id="status-bar" class="status-bar" role="status" aria-live="polite"></div>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="主要區域" hidden>
      <ul class="tabs-list">
        <li>
          <a class="tab" href="#today" data-view="today">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M7 3v3m10-3v3M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm4 9 2 2 4-4" /></svg>
            <span>今日</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#tasks" data-view="tasks">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" /></svg>
            <span>任務</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#habits" data-view="habits">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 5l-8 8-3-3" /></svg>
            <span>習慣</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#finance" data-view="finance">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2" /></svg>
            <span>財務</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#growth" data-view="growth">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8-4.3-4.1 5.9-.9z" /></svg>
            <span>成長</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#settings" data-view="settings">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7.4-3a7.4 7.4 0 0 0-.1-1.3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.2-1.3L14.4 3h-4l-.4 2.4a7.6 7.6 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.6l-2 1.6 2 3.4 2.4-1c.7.5 1.4 1 2.2 1.3l.4 2.4h4l.4-2.4c.8-.3 1.5-.8 2.2-1.3l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.3Z" /></svg>
            <span>設定</span>
          </a>
        </li>
      </ul>
    </nav>

    <main id="main" class="container" tabindex="-1">
      <div id="notices" class="notices"></div>

      <p id="boot-message" class="boot-message">正在載入…</p>
      <div id="file-warning" class="notice notice--error" hidden>
        <p><strong>無法直接用檔案方式開啟。</strong></p>
        <p>請改用本機伺服器預覽（例如在專案資料夾執行 <code>python3 -m http.server 8000</code>，再開啟 <code>http://localhost:8000/</code>），或使用 GitHub Pages 網址。詳見 README。</p>
      </div>
      <noscript>
        <div class="notice notice--error"><p>這個工具需要啟用 JavaScript 才能使用。</p></div>
      </noscript>

      <section class="view" id="view-today" aria-labelledby="heading-today" hidden></section>
      <section class="view" id="view-tasks" aria-labelledby="heading-tasks" hidden></section>
      <section class="view" id="view-habits" aria-labelledby="heading-habits" hidden></section>
      <section class="view" id="view-finance" aria-labelledby="heading-finance" hidden></section>
      <section class="view" id="view-growth" aria-labelledby="heading-growth" hidden></section>
      <section class="view" id="view-settings" aria-labelledby="heading-settings" hidden></section>
      <section class="view" id="view-recovery" aria-labelledby="heading-recovery" hidden></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <dialog id="form-dialog" class="dialog" aria-labelledby="form-dialog-title"></dialog>

    <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog" class="dialog-body">
        <h2 id="confirm-title" class="dialog-title"></h2>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" class="btn btn--secondary" value="cancel" id="confirm-cancel">取消</button>
          <button type="submit" class="btn btn--primary" value="confirm" id="confirm-ok">確定</button>
        </div>
      </form>
    </dialog>

    <script>
      // 用 file:// 直接開啟時，瀏覽器會阻擋 JavaScript 模組，改為顯示說明。
      if (location.protocol === 'file:') {
        document.getElementById('file-warning').hidden = false;
        document.getElementById('boot-message').hidden = true;
      }
    </script>
  </body>
</html>
