<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="每日待辦與習慣管理工具，資料只保存在你的瀏覽器。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>每日待辦與習慣</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="app-header">
      <div class="container">
        <h1 class="app-title">每日待辦與習慣</h1>
        <p class="app-date" id="today-label"></p>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="主要區域" hidden>
      <ul class="tabs-list">
        <li>
          <a class="tab" href="#today" data-view="today">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M7 3v3m10-3v3M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm4 9 2 2 4-4" /></svg>
            <span>今日</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#todos" data-view="todos">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" /></svg>
            <span>所有待辦</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#habits" data-view="habits">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 5l-8 8-3-3" /></svg>
            <span>習慣</span>
          </a>
        </li>
        <li>
          <a class="tab" href="#settings" data-view="settings">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 17v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2" /></svg>
            <span>設定與備份</span>
          </a>
        </li>
      </ul>
    </nav>

    <main id="main" class="container" tabindex="-1">
      <div id="notices" class="notices"></div>

      <p id="boot-message" class="boot-message">正在載入…</p>
      <div id="file-warning" class="notice notice--error" hidden>
        <p><strong>無法直接用檔案方式開啟。</strong></p>
        <p>請改用本機伺服器預覽（例如在專案資料夾執行 <code>python3 -m http.server 8000</code>，再開啟 <code>http://localhost:8000/</code>），或使用 GitHub Pages 網址。詳見 README。</p>
      </div>
      <noscript>
        <div class="notice notice--error"><p>這個工具需要啟用 JavaScript 才能使用。</p></div>
      </noscript>

      <section class="view" id="view-today" data-panel="today" aria-labelledby="heading-today" hidden></section>
      <section class="view" id="view-todos" data-panel="todos" aria-labelledby="heading-todos" hidden></section>
      <section class="view" id="view-habits" data-panel="habits" aria-labelledby="heading-habits" hidden></section>
      <section class="view" id="view-settings" data-panel="settings" aria-labelledby="heading-settings" hidden></section>
      <section class="view" id="view-recovery" aria-labelledby="heading-recovery" hidden></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <dialog id="todo-dialog" class="dialog" aria-labelledby="todo-dialog-title">
      <form id="todo-form" class="dialog-body" novalidate>
        <h2 id="todo-dialog-title" class="dialog-title">新增待辦</h2>

        <div class="field">
          <label for="todo-title">名稱 <span class="required">（必填）</span></label>
          <input id="todo-title" name="title" type="text" maxlength="200" autocomplete="off" required aria-describedby="todo-title-error" />
          <p id="todo-title-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="todo-note">備註 <span class="optional">（選填）</span></label>
          <textarea id="todo-note" name="note" rows="3" maxlength="2000" aria-describedby="todo-note-error"></textarea>
          <p id="todo-note-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="todo-due">截止日期 <span class="optional">（選填）</span></label>
          <div class="inline-field">
            <input id="todo-due" name="dueDate" type="date" aria-describedby="todo-due-error" />
            <button type="button" class="btn btn--ghost" id="todo-due-clear">清除日期</button>
          </div>
          <p id="todo-due-error" class="field-error" hidden></p>
        </div>

        <fieldset class="field">
          <legend>優先程度</legend>
          <div class="segmented">
            <label><input type="radio" name="priority" value="high" /> <span>高</span></label>
            <label><input type="radio" name="priority" value="medium" checked /> <span>中</span></label>
            <label><input type="radio" name="priority" value="low" /> <span>低</span></label>
          </div>
        </fieldset>

        <div class="dialog-actions">
          <button type="button" class="btn btn--secondary" data-close>取消</button>
          <button type="submit" class="btn btn--primary">儲存</button>
        </div>
      </form>
    </dialog>

    <dialog id="habit-dialog" class="dialog" aria-labelledby="habit-dialog-title">
      <form id="habit-form" class="dialog-body" novalidate>
        <h2 id="habit-dialog-title" class="dialog-title">修改習慣名稱</h2>
        <div class="field">
          <label for="habit-name-edit">習慣名稱 <span class="required">（必填）</span></label>
          <input id="habit-name-edit" name="name" type="text" maxlength="100" autocomplete="off" required aria-describedby="habit-name-edit-error" />
          <p id="habit-name-edit-error" class="field-error" hidden></p>
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn--secondary" data-close>取消</button>
          <button type="submit" class="btn btn--primary">儲存</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog" class="dialog-body">
        <h2 id="confirm-title" class="dialog-title"></h2>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" class="btn btn--secondary" value="cancel" id="confirm-cancel">取消</button>
          <button type="submit" class="btn btn--primary" value="confirm" id="confirm-ok">確定</button>
        </div>
      </form>
    </dialog>

    <script>
      // 用 file:// 直接開啟時，瀏覽器會阻擋 JavaScript 模組，改為顯示說明。
      if (location.protocol === 'file:') {
        document.getElementById('file-warning').hidden = false;
        document.getElementById('boot-message').hidden = true;
      }
    </script>
  </body>
</html>
